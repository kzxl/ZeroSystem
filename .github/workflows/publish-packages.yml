name: Publish NuGet Packages (GitHub & NuGet.org)

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish:
    name: Build, Pack & Publish ZeroSystem Packages
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore ZeroSystem.slnx

      - name: Run Unit Tests
        run: dotnet test ZeroSystem.slnx -c Release

      - name: Pack ZeroSystem.Core
        run: dotnet pack src/ZeroSystem.Core/ZeroSystem.Core.csproj -c Release -o packages

      # 1. Push to GitHub Packages
      - name: Push to GitHub Packages
        shell: pwsh
        run: |
          Get-ChildItem -Path packages -Filter *.nupkg | ForEach-Object {
            Write-Host "Pushing $($_.Name) to GitHub Packages..."
            dotnet nuget push $_.FullName --source "https://nuget.pkg.github.com/kzxl/index.json" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
          }

      # 2. NuGet.org Login (OIDC Trusted Publishing)
      - name: NuGet.org Login (OIDC Trusted Publishing)
        uses: NuGet/login@v1
        id: nuget-login
        continue-on-error: true
        with:
          user: ${{ secrets.NUGET_USER || 'kzxl' }}

      # 3. Push to NuGet.org
      - name: Push to NuGet.org
        env:
          NUGET_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY != '' && steps.nuget-login.outputs.NUGET_API_KEY || secrets.NUGET_API_KEY }}
        if: env.NUGET_KEY != ''
        shell: pwsh
        run: |
          Get-ChildItem -Path packages -Filter *.nupkg | ForEach-Object {
            Write-Host "Pushing $($_.Name) to NuGet.org..."
            dotnet nuget push $_.FullName --source "https://api.nuget.org/v3/index.json" --api-key $env:NUGET_KEY --skip-duplicate
          }

      # 4. Upload Packages as Artifact
      - name: Upload Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zerosystem-packages
          path: packages/*.nupkg
